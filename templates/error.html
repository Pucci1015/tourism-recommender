{% extends "base.html" %}

{% block title %}{{ code }} {{ title }} | 観光地推薦システム{% endblock %}

{% block content %}
    <section class="error-page">
        <p class="error-code">{{ code }}</p>
        <h1 class="error-title">{{ title }}</h1>
        <p class="error-message">{{ message }}</p>
        <a class="btn-primary" href="{{ url_for('index') }}">トップページへ戻る</a>
    </section>
{% endblock %}
